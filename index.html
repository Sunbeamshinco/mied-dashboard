<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIED公益三阶第17期 - 学员培训展示平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f4f8;
  color: #333;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 24px 32px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header h1 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 6px;
}
.header .meta {
  font-size: 13px;
  opacity: 0.85;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.filter-bar {
  padding: 12px 32px;
  background: white;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid #e8ecf1;
}
.filter-bar input {
  padding: 6px 14px;
  border: 1px solid #d0d5dd;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.filter-bar input:focus {
  border-color: #667eea;
}
.filter-bar select {
  padding: 6px 10px;
  border: 1px solid #d0d5dd;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.refresh-btn {
  padding: 6px 16px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.refresh-btn:hover { background: #5a6fd6; }
.refresh-btn:disabled { background: #bbb; cursor: not-allowed; }
.auto-refresh {
  font-size: 12px;
  color: #888;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.content {
  padding: 20px 32px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  font-size: 13px;
}
thead th {
  background: #f7f9fc;
  padding: 12px 10px;
  text-align: left;
  font-weight: 600;
  color: #555;
  border-bottom: 2px solid #e8ecf1;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
thead th.small { font-size: 11px; }
tbody td {
  padding: 10px;
  border-bottom: 1px solid #f0f2f5;
  vertical-align: middle;
}
tbody tr:hover { background: #f7f9ff; }
.lecture-dots {
  display: flex;
  gap: 3px;
}
.dot {
  width: 20px; height: 20px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
}
.dot-done { background: #c8e6c9; color: #2e7d32; }
.dot-empty { background: #f5f5f5; color: #ccc; }
.time-text { font-size: 12px; color: #666; white-space: nowrap; }
.lecture-time-text {
  font-size: 13px;
  font-weight: 500;
  color: #333;
  white-space: nowrap;
}
.lecture-time-empty {
  font-size: 12px;
  color: #ccc;
}
.weekly-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
}
.weekly-yes { background: #c8e6c9; color: #2e7d32; }
.weekly-no { background: #f5f5f5; color: #999; }
.footer {
  padding: 16px 32px;
  text-align: center;
  font-size: 12px;
  color: #aaa;
}
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  font-size: 16px; color: #667eea;
}
.loading-overlay.hidden { display: none; }
.no-data {
  text-align: center; padding: 60px; color: #999; font-size: 16px;
}
</style>
</head>
<body>

<div class="header">
  <h1>MIED公益三阶第17期 - 师资培训展示平台</h1>
  <div class="meta">
    <span>数据来源: 腾讯文档智能表格</span>
    <span id="updateTime">--</span>
  </div>
</div>

<div class="filter-bar">
  <input type="text" id="searchInput" placeholder="搜索学员姓名..." oninput="renderTable()">
  <select id="mockFilter" onchange="renderTable()">
    <option value="">未完成模拟讲座带领: 全部</option>
    <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
  </select>
  <select id="ledFilter" onchange="renderTable()">
    <option value="">未完成真实讲座带领: 全部</option>
    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
  </select>
  <select id="reportFilter" onchange="renderTable()">
    <option value="">未提交真实讲座报告: 全部</option>
    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
  </select>
  <select id="weekFilter" onchange="renderTable()">
    <option value="">本周是否更新: 全部</option>
    <option value="yes">是</option>
    <option value="no">否</option>
  </select>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">🔄 手动刷新数据</button>
</div>

<div class="content">
  <div class="loading-overlay hidden" id="loadingOverlay">⏳ 正在刷新数据...</div>
  <table id="dataTable">
    <thead>
      <tr>
        <th rowspan="2" style="min-width:70px">学员姓名</th>
        <th class="small" colspan="4">模拟讲座</th>
        <th class="small" colspan="6">真实讲座带领</th>
        <th class="small" colspan="6">报告提交</th>
        <th rowspan="2" style="min-width:160px">最新报告及时间</th>
        <th rowspan="2" style="min-width:130px">报告最近更新</th>
        <th rowspan="2" style="min-width:90px">本周是否更新</th>
      </tr>
      <tr>
        <th class="small">1</th><th class="small">2</th><th class="small">3</th><th class="small">4</th>
        <th class="small">1</th><th class="small">2</th><th class="small">3</th>
        <th class="small">4</th><th class="small">5</th><th class="small">6</th>
        <th class="small">1</th><th class="small">2</th><th class="small">3</th>
        <th class="small">4</th><th class="small">5</th><th class="small">6</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-data hidden" id="noData">暂无数据</div>
</div>

<div class="footer">
  MIED公益三阶第17期师资培训展示平台 · 点击"手动刷新数据"获取最新数据 · Powered by WorkBuddy + 腾讯文档
</div>

<script>
// ========== 数据层 ==========
let dashboardData = null;

function loadData() {
  return fetch('dashboard_data.json?t=' + Date.now())
    .then(r => r.json())
    .catch(() => Promise.resolve(typeof EMBEDDED_DATA !== 'undefined' ? EMBEDDED_DATA : {students: []}));
}

// ========== 渲染层 ==========
function renderTable() {
  if (!dashboardData) return;
  
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const mockFilter = document.getElementById('mockFilter')?.value || '';
  const ledFilter = document.getElementById('ledFilter')?.value || '';
  const reportFilter = document.getElementById('reportFilter')?.value || '';
  const weekFilter = document.getElementById('weekFilter')?.value || '';
  
  let students = dashboardData.students.filter(s => {
    if (search && !s.name.toLowerCase().includes(search)) return false;
    if (mockFilter && hasCompleted(s.mock_list, mockFilter)) return false;
    if (ledFilter && hasCompleted(s.led_list, ledFilter)) return false;
    if (reportFilter && hasCompleted(s.reported_list, reportFilter)) return false;
    if (weekFilter === 'yes' && !isThisWeek(s.last_modify_time)) return false;
    if (weekFilter === 'no' && isThisWeek(s.last_modify_time)) return false;
    return true;
  });

  // 按拼音 A-Z 排序
  students.sort(function(a, b) {
    return a.name.localeCompare(b.name, 'zh-Hans-CN');
  });
  
  const tbody = document.getElementById('tableBody');
  const noData = document.getElementById('noData');
  
  if (students.length === 0) {
    tbody.innerHTML = '';
    noData.classList.remove('hidden');
    return;
  }
  noData.classList.add('hidden');
  
  tbody.innerHTML = students.map(s => `
    <tr>
      <td><strong>${esc(s.name)}</strong></td>
      ${renderDots(s.mock_list, 4)}
      ${renderDots(s.led_list, 6)}
      ${renderDots(s.reported_list, 6)}
      <td>
        ${s.lecture_time
          ? `<span class="lecture-time-text">${esc(s.latest_report || '报告')}: ${esc(s.lecture_time)}</span>`
          : '<span class="lecture-time-empty">--</span>'}
      </td>
      <td class="time-text">${s.last_modify_time || '--'}</td>
      <td>${weeklyBadge(s.last_modify_time)}</td>
    </tr>
  `).join('');
}

function renderDots(list, total) {
  // 兼容两种格式: 字符串数组 ["1","3"] 或 布尔数组 [true,false,true]
  let html = '';
  for (let i = 1; i <= total; i++) {
    let done = false;
    if (Array.isArray(list)) {
      // 格式1: ["1", "3"]
      if (typeof list[0] === 'string') {
        done = list.indexOf(String(i)) !== -1;
      }
      // 格式2: [true, false, true, false]
      else if (typeof list[0] === 'boolean') {
        done = list[i - 1] === true;
      }
      // 格式3: 数字数组
      else if (typeof list[0] === 'number') {
        done = list.indexOf(i) !== -1;
      }
    }
    html += `<td><div class="dot ${done ? 'dot-done' : 'dot-empty'}">${done ? '✓' : ''}</div></td>`;
  }
  return html;
}

function hasCompleted(list, num) {
  if (!Array.isArray(list) || list.length === 0) return false;
  return list.indexOf(String(num)) !== -1;
}

function isThisWeek(timeStr) {
  if (!timeStr || timeStr === '--') return false;
  var m = timeStr.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return false;
  var d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  var now = new Date();
  // 7 days ago (start of day)
  var weekAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
  return d >= weekAgo;
}

function weeklyBadge(timeStr) {
  if (!timeStr || timeStr === '--') return '<span class="weekly-badge weekly-no">否</span>';
  var m = timeStr.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '<span class="weekly-badge weekly-no">否</span>';
  return isThisWeek(timeStr)
    ? '<span class="weekly-badge weekly-yes">是</span>'
    : '<span class="weekly-badge weekly-no">否</span>';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateTimeDisplay() {
  if (dashboardData) {
    var t = dashboardData.generated_at || dashboardData.update_time || '--';
    document.getElementById('updateTime').textContent = '数据更新时间: ' + t;
  }
}

// ========== 刷新逻辑 ==========
function refreshData() {
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 刷新中...';
  location.reload();
}

// ========== 初始化 ==========
function init() {
  loadData().then(data => {
    dashboardData = data;
    renderTable();
    updateTimeDisplay();
  }).catch(err => {
    console.error('初始化失败:', err);
  });
}

</script>
